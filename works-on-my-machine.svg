<svg viewBox="0 0 1600 560" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue',cursive">
  <defs>
    <style>
      .panel { fill: #fdf6e3; stroke: #111; stroke-width: 5; }
      .cap { fill: #b392f0; stroke: #111; stroke-width: 3; }
      .captxt { font-size: 21px; font-weight: bold; fill: #111; }
      .bubble { fill: #fff; stroke: #111; stroke-width: 3; }
      .say { font-size: 25px; fill: #111; text-anchor: middle; }
      .ink { stroke: #111; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .skin { fill: #f2c9a0; stroke: #111; stroke-width: 3.5; }
      .term { font-family: 'DejaVu Sans Mono', Menlo, Consolas, monospace; font-size: 14px; }
    </style>
    <!-- Person A: dark hair with a bun, purple shirt -->
    <g id="headA">
      <circle cx="0" cy="-58" r="17" fill="#3b2a20" stroke="#111" stroke-width="3"/>
      <circle cx="0" cy="0" r="44" class="skin"/>
      <path d="M-44,-4 C-46,-50 46,-50 44,-4 C30,-26 -20,-34 -44,-4 z" fill="#3b2a20" stroke="#111" stroke-width="3"/>
    </g>
    <!-- Person B: short orange hair, teal shirt -->
    <g id="headB">
      <circle cx="0" cy="0" r="44" class="skin"/>
      <path d="M-46,-2 C-50,-60 50,-60 46,-2 L38,-18 L26,-6 L14,-22 L0,-8 L-14,-22 L-26,-6 L-38,-18 z" fill="#d9622b" stroke="#111" stroke-width="3"/>
    </g>
    <g id="laptop">
      <rect x="0" y="0" width="200" height="124" rx="8" fill="#2b2b2b" stroke="#111" stroke-width="4"/>
      <rect x="10" y="10" width="180" height="104" rx="3" fill="#0d1117"/>
      <path d="M-14,124 h228 l-10,14 h-208 z" fill="#9aa3ad" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- ===== Panel 1 ===== -->
  <g transform="translate(14,14)">
    <rect class="panel" width="372" height="532" rx="6"/>
    <rect class="cap" x="-2" y="-2" width="214" height="40"/>
    <text class="captxt" x="12" y="26">1 · Your laptop</text>
    <path class="bubble" d="M30,58 h250 a18,18 0 0 1 18,18 v58 a18,18 0 0 1 -18,18 h-150 l-34,34 l6,-34 h-72 a18,18 0 0 1 -18,-18 v-58 a18,18 0 0 1 18,-18 z"/>
    <text class="say" x="155" y="98">My analysis</text>
    <text class="say" x="155" y="130">works! ✓</text>
    <line x1="0" y1="436" x2="372" y2="436" stroke="#111" stroke-width="4"/>
    <!-- body -->
    <path d="M40,436 C40,330 140,330 140,436 z" fill="#a78bfa" stroke="#111" stroke-width="3.5"/>
    <use href="#headA" x="90" y="290"/>
    <circle cx="104" cy="284" r="4" fill="#111"/><circle cx="124" cy="284" r="4" fill="#111"/>
    <path class="ink" d="M100,304 q14,14 28,0"/>
    <use href="#laptop" x="156" y="298"/>
    <text class="term" x="172" y="330" fill="#e1e4e8">$ python3 analysis.py</text>
    <text class="term" x="172" y="354" fill="#85e89d">✓ plot saved</text>
    <text class="term" x="172" y="400" fill="#8b949e">pandas 1.5</text>
    <text x="186" y="488" font-size="20" fill="#555" text-anchor="middle">pip3 install pandas… a year ago</text>
  </g>

  <!-- ===== Panel 2 ===== -->
  <g transform="translate(410,14)">
    <rect class="panel" width="372" height="532" rx="6"/>
    <rect class="cap" x="-2" y="-2" width="286" height="40"/>
    <text class="captxt" x="12" y="26">2 · Send it to a friend</text>
    <path class="bubble" d="M30,58 h300 a18,18 0 0 1 18,18 v58 a18,18 0 0 1 -18,18 h-210 l-34,34 l6,-34 h-56 a18,18 0 0 1 -18,-18 v-58 a18,18 0 0 1 18,-18 z"/>
    <text class="say" x="180" y="98">Here's my script,</text>
    <text class="say" x="180" y="130">just run it!</text>
    <line x1="0" y1="436" x2="372" y2="436" stroke="#111" stroke-width="4"/>
    <path d="M40,436 C40,330 140,330 140,436 z" fill="#a78bfa" stroke="#111" stroke-width="3.5"/>
    <path class="ink" d="M128,372 L170,352 L196,334"/>
    <use href="#headA" x="90" y="290"/>
    <circle cx="104" cy="284" r="4" fill="#111"/>
    <path class="ink" d="M118,284 q6,-6 12,0"/>
    <path class="ink" d="M100,304 q14,14 28,0"/>
    <!-- flying file -->
    <g transform="translate(222,268) rotate(-10)">
      <path d="M0,0 h62 l20,20 v82 h-82 z" fill="#fff" stroke="#111" stroke-width="3.5"/>
      <path d="M62,0 v20 h20" fill="none" stroke="#111" stroke-width="3"/>
      <text x="41" y="64" class="term" font-size="22" font-weight="bold" fill="#b392f0" text-anchor="middle">.py</text><path d="M14,78 h52 M14,88 h40" stroke="#999" stroke-width="3"/>
      <text x="41" y="126" class="term" style="font-size:15px" fill="#111" text-anchor="middle">analysis.py</text>
    </g>
    <path d="M150,250 q40,-30 70,0" class="ink" stroke-width="3" stroke-dasharray="6 8"/>
    <text x="186" y="488" font-size="20" fill="#555" text-anchor="middle">(only the .py file)</text>
  </g>

  <!-- ===== Panel 3 ===== -->
  <g transform="translate(806,14)">
    <rect class="panel" width="372" height="532" rx="6"/>
    <rect class="cap" x="-2" y="-2" width="240" height="40"/>
    <text class="captxt" x="12" y="26">3 · Friend's laptop</text>
    <path class="bubble" d="M40,52 l22,26 l18,-20 l14,22 l26,-16 l4,26 l28,-6 l-10,26 l24,12 l-24,14 l14,22 l-28,0 l-2,26 l-24,-14 l-16,22 l-14,-24 l-24,12 l2,-26 l-26,-4 l16,-20 l-20,-16 l26,-8 l-8,-26 l26,6 z" transform="translate(30,0)"/>
    <text class="say" x="132" y="124" font-weight="bold" font-size="23">CRASH!</text>
    <line x1="0" y1="436" x2="372" y2="436" stroke="#111" stroke-width="4"/>
    <path d="M232,436 C232,330 332,330 332,436 z" fill="#2dd4bf" stroke="#111" stroke-width="3.5"/>
    <use href="#headB" x="282" y="290"/>
    <circle cx="266" cy="284" r="7" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="266" cy="284" r="2.5" fill="#111"/>
    <circle cx="290" cy="284" r="7" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="290" cy="284" r="2.5" fill="#111"/>
    <ellipse cx="278" cy="310" rx="8" ry="10" fill="#111"/>
    <path d="M318,250 q8,12 0,20 q-8,-8 0,-20" fill="#79b8ff" stroke="#111" stroke-width="2"/>
    <use href="#laptop" x="20" y="298"/>
    <rect x="30" y="308" width="180" height="104" fill="#3b0d0d"/>
    <text class="term" x="36" y="328" fill="#e1e4e8" style="font-size:11px">$ python3 analysis.py</text>
    <text class="term" x="36" y="350" fill="#ff7b72" style="font-size:11px">AttributeError:</text>
    <text class="term" x="36" y="366" fill="#ff7b72" style="font-size:11px">'DataFrame' object has</text>
    <text class="term" x="36" y="382" fill="#ff7b72" style="font-size:11px">no attribute 'append'</text>
    <text class="term" x="36" y="404" fill="#8b949e" style="font-size:11px">pandas 2.2</text>
    <text x="186" y="488" font-size="20" fill="#555" text-anchor="middle">different pandas, different result</text>
  </g>

  <!-- ===== Panel 4 ===== -->
  <g transform="translate(1202,14)">
    <rect class="panel" width="384" height="532" rx="6"/>
    <rect class="cap" x="-2" y="-2" width="132" height="40"/>
    <text class="captxt" x="14" y="26">4 · Oops</text>
    <path class="bubble" d="M24,58 h312 a18,18 0 0 1 18,18 v62 a18,18 0 0 1 -18,18 h-210 l-30,40 l2,-40 h-74 a18,18 0 0 1 -18,-18 v-62 a18,18 0 0 1 18,-18 z"/>
    <text class="say" x="180" y="100" font-weight="bold">But it works</text>
    <text class="say" x="180" y="134" font-weight="bold">on my machine!</text>
    <line x1="0" y1="436" x2="384" y2="436" stroke="#111" stroke-width="4"/>
    <!-- A shrugging -->
    <path d="M50,436 C50,330 150,330 150,436 z" fill="#a78bfa" stroke="#111" stroke-width="3.5"/>
    <path class="ink" d="M62,372 L30,340 L20,312 M138,372 L170,340 L180,312"/>
    <use href="#headA" x="100" y="290"/>
    <path class="ink" d="M106,282 q6,-6 12,0 M126,282 q6,-6 12,0" stroke-width="3.5"/>
    <path class="ink" d="M110,306 q12,8 24,0"/>
    <!-- B unimpressed -->
    <path d="M250,436 C250,330 350,330 350,436 z" fill="#2dd4bf" stroke="#111" stroke-width="3.5"/>
    <use href="#headB" x="300" y="290"/>
    <path class="ink" d="M274,284 h14 M296,284 h14" stroke-width="4"/>
    <path class="ink" d="M282,308 h22"/>
    <text x="192" y="478" font-size="19" fill="#555" text-anchor="middle">Nobody wrote down which</text>
    <text x="192" y="502" font-size="19" fill="#555" text-anchor="middle">versions the project needs</text>
  </g>
</svg>
