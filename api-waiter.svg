<svg viewBox="0 0 1600 560" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue',cursive">
  <defs>
    <style>
      .panel { fill: #fdf6e3; stroke: #111; stroke-width: 5; }
      .cap { fill: #b392f0; stroke: #111; stroke-width: 3; }
      .captxt { font-size: 21px; font-weight: bold; fill: #111; }
      .bubble { fill: #fff; stroke: #111; stroke-width: 3; }
      .say { font-size: 24px; fill: #111; text-anchor: middle; }
      .ink { stroke: #111; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .skin { fill: #f2c9a0; stroke: #111; stroke-width: 3.5; }
      .term { font-family: 'DejaVu Sans Mono', Menlo, Consolas, monospace; font-size: 14px; }
    </style>
    <!-- Person A: dark hair with a bun, purple shirt -->
    <g id="headA">
      <circle cx="0" cy="-58" r="17" fill="#3b2a20" stroke="#111" stroke-width="3"/>
      <circle cx="0" cy="0" r="44" class="skin"/>
      <path d="M-44,-4 C-46,-50 46,-50 44,-4 C30,-26 -20,-34 -44,-4 z" fill="#3b2a20" stroke="#111" stroke-width="3"/>
    </g>
    <!-- Person B: short orange hair, teal shirt -->
    <g id="headB">
      <circle cx="0" cy="0" r="44" class="skin"/>
      <path d="M-46,-2 C-50,-60 50,-60 46,-2 L38,-18 L26,-6 L14,-22 L0,-8 L-14,-22 L-26,-6 L-38,-18 z" fill="#d9622b" stroke="#111" stroke-width="3"/>
    </g>
    <g id="laptop">
      <rect x="0" y="0" width="200" height="124" rx="8" fill="#2b2b2b" stroke="#111" stroke-width="4"/>
      <rect x="10" y="10" width="180" height="104" rx="3" fill="#0d1117"/>
      <path d="M-14,124 h228 l-10,14 h-208 z" fill="#9aa3ad" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    </g>
  
  <g id="headW">
    <circle cx="0" cy="0" r="44" class="skin"/>
    <path d="M-44,-6 C-44,-56 44,-56 44,-6 C34,-30 -34,-30 -44,-6 z" fill="#1f1f1f" stroke="#111" stroke-width="3"/>
  </g>
  <g id="waiterBody">
    <path d="M-50,146 C-50,40 50,40 50,146 z" fill="#ffffff" stroke="#111" stroke-width="3.5"/>
    <path d="M-50,146 C-50,70 -40,52 -22,48 L-4,146 z M50,146 C50,70 40,52 22,48 L4,146 z" fill="#2b2b2b" stroke="#111" stroke-width="3"/>
    <path d="M-16,46 L0,54 L16,46 L16,64 L0,56 L-16,64 z" fill="#e5484d" stroke="#111" stroke-width="2.5"/>
  </g>
  <g id="chefHead">
    <circle cx="0" cy="0" r="44" class="skin"/>
    <path d="M-36,-28 h72 v-22 h-72 z" fill="#fff" stroke="#111" stroke-width="3"/>
    <path d="M-36,-50 C-62,-60 -50,-104 -20,-92 C-14,-122 22,-122 26,-92 C56,-104 64,-60 36,-50 z" fill="#fff" stroke="#111" stroke-width="3"/>
  </g>
</defs>
  <g transform="translate(14,14)">
    <rect class="panel" width="372" height="532" rx="6"/>
    <line x1="0" y1="436" x2="372" y2="436" stroke="#111" stroke-width="4"/><path class="bubble" d="M42,52 h264 a18,18 0 0 1 18,18 v64 a18,18 0 0 1 -18,18 h-146 l-22,36 l2,-36 h-78 a18,18 0 0 1 -18,-18 v-64 a18,18 0 0 1 18,-18 z"/>
    <text class="say" x="174" y="94">One BRCA2, human,</text>
    <text class="say" x="174" y="126">please!</text>
    <path d="M40,436 C40,330 140,330 140,436 z" fill="#a78bfa" stroke="#111" stroke-width="3.5"/>
    <use href="#headA" x="90" y="290"/><circle cx="96" cy="284" r="4" fill="#111"/><circle cx="116" cy="284" r="4" fill="#111"/><path class="ink" d="M104,304 q12,12 24,0"/>
    <use href="#laptop" x="156" y="298"/>
    <text class="term" x="170" y="334" fill="#e1e4e8">requests.get(url)</text>
    <text class="term" x="170" y="362" fill="#79b8ff" style="font-size:12px">.../homo_sapiens/</text>
    <text class="term" x="170" y="380" fill="#79b8ff" style="font-size:12px">BRCA2</text>
<text x="186" y="492" font-size="20" fill="#555" text-anchor="middle">your program = the guest</text>
    <rect class="cap" x="-2" y="-2" width="190" height="40"/>
    <text class="captxt" x="12" y="26">1 · You order</text>
  </g>
  <g transform="translate(410,14)">
    <rect class="panel" width="372" height="532" rx="6"/>
    <line x1="0" y1="436" x2="372" y2="436" stroke="#111" stroke-width="4"/><path class="bubble" d="M38,52 h214 a18,18 0 0 1 18,18 v64 a18,18 0 0 1 -18,18 h-122 l-22,36 l2,-36 h-52 a18,18 0 0 1 -18,-18 v-64 a18,18 0 0 1 18,-18 z"/>
    <text class="say" x="145" y="94">BRCA2 for</text>
    <text class="say" x="145" y="126">table 5!</text>
    <rect x="250" y="196" width="110" height="240" fill="#c8915a" stroke="#111" stroke-width="4"/>
    <circle cx="305" cy="262" r="26" fill="#bfe3ff" stroke="#111" stroke-width="3.5"/>
    <rect x="262" y="320" width="86" height="30" rx="4" fill="#fdf6e3" stroke="#111" stroke-width="2.5"/>
    <text x="305" y="342" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">KITCHEN</text>
    <use href="#waiterBody" x="110" y="290"/>
    <use href="#headW" x="110" y="274"/><circle cx="116" cy="270" r="4" fill="#111"/><circle cx="136" cy="270" r="4" fill="#111"/><path class="ink" d="M124,290 q12,12 24,0"/>
    <g transform="translate(150,330) rotate(8)">
      <rect x="0" y="0" width="74" height="90" rx="4" fill="#fff" stroke="#111" stroke-width="3"/>
      <text x="37" y="30" text-anchor="middle" class="term" style="font-size:14px" fill="#111">BRCA2</text>
      <text x="37" y="52" text-anchor="middle" class="term" style="font-size:12px" fill="#555">human</text>
      <path d="M12,68 h50" stroke="#999" stroke-width="3"/>
    </g>
    <path class="ink" d="M150,350 L176,348"/>
<text x="186" y="492" font-size="20" fill="#555" text-anchor="middle">the API = the waiter</text>
    <rect class="cap" x="-2" y="-2" width="196" height="40"/>
    <text class="captxt" x="12" y="26">2 · The waiter</text>
  </g>
  <g transform="translate(806,14)">
    <rect class="panel" width="372" height="532" rx="6"/>
    <line x1="0" y1="436" x2="372" y2="436" stroke="#111" stroke-width="4"/><path class="bubble" d="M38,52 h298 a18,18 0 0 1 18,18 v64 a18,18 0 0 1 -18,18 h-206 l-22,36 l2,-36 h-52 a18,18 0 0 1 -18,-18 v-64 a18,18 0 0 1 18,-18 z"/>
    <text class="say" x="187" y="94">BRCA2… chromosome 13,</text>
    <text class="say" x="187" y="126">coming up!</text>
<line x1="150" y1="266" x2="362" y2="266" stroke="#7a5230" stroke-width="6"/><rect x="156" y="214" width="60" height="50" rx="8" fill="#e8ecef" stroke="#111" stroke-width="2.5"/><text x="186" y="245" text-anchor="middle" class="term" style="font-size:12px;font-weight:bold" fill="#111">BRCA1</text><rect x="226" y="214" width="60" height="50" rx="8" fill="#e8ecef" stroke="#111" stroke-width="2.5"/><text x="256" y="245" text-anchor="middle" class="term" style="font-size:12px;font-weight:bold" fill="#111">TP53</text><rect x="296" y="214" width="60" height="50" rx="8" fill="#e8ecef" stroke="#111" stroke-width="2.5"/><text x="326" y="245" text-anchor="middle" class="term" style="font-size:12px;font-weight:bold" fill="#111">EGFR</text><line x1="150" y1="338" x2="362" y2="338" stroke="#7a5230" stroke-width="6"/><rect x="156" y="286" width="60" height="50" rx="8" fill="#e8ecef" stroke="#111" stroke-width="2.5"/><text x="186" y="317" text-anchor="middle" class="term" style="font-size:12px;font-weight:bold" fill="#111">MYC</text><rect x="226" y="286" width="60" height="50" rx="8" fill="#ffd43b" stroke="#111" stroke-width="3.5"/><text x="256" y="317" text-anchor="middle" class="term" style="font-size:12px;font-weight:bold" fill="#111">BRCA2</text><rect x="296" y="286" width="60" height="50" rx="8" fill="#e8ecef" stroke="#111" stroke-width="2.5"/><text x="326" y="317" text-anchor="middle" class="term" style="font-size:12px;font-weight:bold" fill="#111">KRAS</text><line x1="150" y1="410" x2="362" y2="410" stroke="#7a5230" stroke-width="6"/><rect x="156" y="358" width="60" height="50" rx="8" fill="#e8ecef" stroke="#111" stroke-width="2.5"/><text x="186" y="389" text-anchor="middle" class="term" style="font-size:12px;font-weight:bold" fill="#111">CFTR</text><rect x="226" y="358" width="60" height="50" rx="8" fill="#e8ecef" stroke="#111" stroke-width="2.5"/><text x="256" y="389" text-anchor="middle" class="term" style="font-size:12px;font-weight:bold" fill="#111">HBB</text><rect x="296" y="358" width="60" height="50" rx="8" fill="#e8ecef" stroke="#111" stroke-width="2.5"/><text x="326" y="389" text-anchor="middle" class="term" style="font-size:12px;font-weight:bold" fill="#111">…</text>
    <path d="M30,436 C30,330 130,330 130,436 z" fill="#ffffff" stroke="#111" stroke-width="3.5"/>
    <use href="#chefHead" x="80" y="292"/><path class="ink" d="M74,290 q6,-7 12,0 M94,290 q6,-7 12,0" stroke-width="3.5"/><path class="ink" d="M82,310 q12,12 24,0"/>
    <path class="ink" d="M116,372 L170,300"/>
<text x="186" y="492" font-size="20" fill="#555" text-anchor="middle">the kitchen = Ensembl's database</text>
    <rect class="cap" x="-2" y="-2" width="206" height="40"/>
    <text class="captxt" x="12" y="26">3 · The kitchen</text>
  </g>
  <g transform="translate(1202,14)">
    <rect class="panel" width="384" height="532" rx="6"/>
    <line x1="0" y1="436" x2="372" y2="436" stroke="#111" stroke-width="4"/>
    <path class="bubble" d="M140,52 h196 a18,18 0 0 1 18,18 v64 a18,18 0 0 1 -18,18 h-196 a18,18 0 0 1 -18,-18 v-24 l-30,-8 l30,-14 v-18 a18,18 0 0 1 18,-18 z"/>
    <text class="say" x="238" y="94">Thanks! Just the</text>
    <text class="say" x="238" y="126">data I asked for</text>
    <use href="#waiterBody" x="80" y="290"/>
    <use href="#headW" x="80" y="274"/><path class="ink" d="M80,270 q6,-7 12,0 M100,270 q6,-7 12,0" stroke-width="3.5"/><path class="ink" d="M94,290 q12,12 24,0"/>
    <path class="ink" d="M118,360 L170,336"/>
    <rect x="140" y="196" width="226" height="136" rx="6" fill="#0d1117" stroke="#111" stroke-width="3"/>
    <g class="term" style="font-size:11.5px">
      <text x="150" y="220" fill="#e1e4e8">{</text>
      <text x="158" y="242" fill="#79b8ff">"display_name": <tspan fill="#9ecbff">"BRCA2"</tspan>,</text>
      <text x="158" y="264" fill="#79b8ff">"seq_region_name": <tspan fill="#9ecbff">"13"</tspan>,</text>
      <text x="158" y="286" fill="#79b8ff">"start": <tspan fill="#f8c555">32315086</tspan>,</text>
      <text x="158" y="306" fill="#8b949e">...</text>
      <text x="150" y="324" fill="#e1e4e8">}</text>
    </g>
    <ellipse cx="250" cy="342" rx="116" ry="16" fill="#e8ecef" stroke="#111" stroke-width="3.5"/>
<text x="192" y="492" font-size="20" fill="#555" text-anchor="middle">data on a plate (JSON)</text>
    <rect class="cap" x="-2" y="-2" width="170" height="40"/>
    <text class="captxt" x="12" y="26">4 · Served!</text>
  </g>
</svg>
